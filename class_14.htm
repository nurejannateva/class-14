<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/bootstrap.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <title>Bootstrap</title>
    <style>
        body{
            font-family: "Space Grotesk", sans-serif;
        }
    </style>
</head>
<body  class="d-flex justify-content-center my-5">
    <!-- form start -->
    
    <div class="w-50 bg-light shadow-lg p-5 d-flex align-items-center flex-column">

        <!-- participants information start -->
         
          <img  style="width:1000px ; height:300px; " src="img/Untitled-1-01.png" alt="">
        <p class="bg-info w-50 text-center py-2 fw-bold">Participants Information</p>
        <div class="w-100 mb-3">
            <p class="mb-1">Full Name:</p>
            <input class="w-100 py-1 px-2" placeholder="Ex: John" aria-label="" type="text" name="" id="">
        </div>

        <div class="d-flex w-100">
            <div class="w-50 me-4">
                <p class="mb-1">Date of Birth:</p>
                <input class="w-100 p-1" aria-label="date" type="date" name="" id="">
            </div>

            <div class="w-50">
                <p class="mb-1">Gender:</p>
                <input aria-label="gender" type="radio" name="male" id="male">
                <label for="male">Male</label>
                <input aria-label="gender" type="radio" name="female" id="female">
                <label for="female">Female</label>
            </div>
        </div>

        <div class="d-flex w-100 py-3">
            <div class="me-4 ">
                <p class="mb-1">Email address:</p>
                 <input class="px-4 py-1 " type="text" name="" id="">
            </div>
            <div class="w-50">
                <p class="mb-1">Phone Number</p>
                <input class="py-1 px-4" type="text" name="" id="">
            </div>
        </div>
        <!-- participants information end -->

         <!-- Emergency contact start -->
        <div class="w-50 py-3 ">
            <p class="bg-info py-2 text-center fw-bold  ">Emergency contact </p>
        </div>
       
        <div class="d-flex py-2">
            <p class="me-4 ">Emergency contact Name:</p>
            <input class=" px-5 " type="text" name="" id="">
        </div>

        <div class="d-flex w-100 py-3">
            <div class="me-4 ">
                <p class="mb-1">Relationship to Participant:</p>
                <input class="py-1 px-4" type="text" name="" id="">
            </div>
            <div>
                <p class="mb-1">Emergency contact Number</p>
                <input class="px-4 py-1" type="text" name="" id="">
            </div>
        </div>
        <!-- Emergency contact end -->

        <!-- Sport Information start-->
         <div class="w-50 py-3">
         <p class="bg-info text-center py-2 fw-bold">Sport Information</p>
         </div>
         <div class="w-100  d-flex">
            <div  class="me-4">
                <p class="mb-1">Sport Information In:</p>
                <input type="radio" name="" id="">
                <label for="soccer">Soccer</label><br>
                <input type="radio" name="" id="">
                <label for="basketball">Basketball</label><br>
                <input type="radio" name="" id="">
                <label for="tennis">Tennis</label><br>
                <input type="radio" name="" id="">
                <label for="badminton">Badminton</label><br>
                <div class="d-flex ">
                <input  type="radio" name="" id="">
                <label class="me-2 py-1" for="other">Other:</label>
                <input  type="text " name="" id="">
                </div>
            </div>
            <div>
                <p class="mb-1">Skill Levle:</p>
                <input type="radio" name="" id="">
                <label for="beginner">Beginner</label>
                <input type="radio" name="" id="">
                <label for="intermediate">Intermediate</label><br>
                <input type="radio" name="" id="">
                <label  for="advanced">Advanced</label>
                    
                <p class="mb-1">Praferred Position/Role:</p>
                <input class="px-2 py-1" type="text" name="" id="">
                   

            </div>
         </div>

    </div>
    <!-- git -->
    
    <!-- script -->
    <script src="./js/bootstrap.min.js"></script>
</body>
</html>
